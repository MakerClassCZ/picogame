# Sanity checks for a docs PR. Deliberately narrow: it runs on the docs tree alone, with no
# dependency on the site (a separate repo) or the firmware bindings, so a contributor gets an
# answer in seconds. The full pre-publish gate (API-name lint, EN/CZ heading structure) runs at
# deploy time against the live tooling.
name: docs

on:
  pull_request:
    paths: ["docs/**"]
  push:
    paths: ["docs/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every page has a title and a description
        run: |
          fail=0
          for f in docs/*.md docs/cs/*.md docs/cs/*/*.md; do
            [ -e "$f" ] || continue
            [ "$(basename "$f")" = "README.md" ] && continue
            head -1 "$f" | grep -q '^# ' || { echo "$f: first line must be a '# Title'"; fail=1; }
            sed -n '2,6p' "$f" | grep -q '[A-Za-z]' || { echo "$f: needs an opening paragraph (it becomes the page description)"; fail=1; }
          done
          exit $fail
      - name: Images and audio referenced from a page exist
        run: |
          fail=0
          # `... | while read` runs the loop in a SUBSHELL, so fail=1 was set there and lost and this
          # check reported green no matter what it printed. Feed the loop instead of piping into it.
          while read -r rel; do
            f="docs/$(echo "$rel" | sed 's|^\.\./||; s|^\./||')"
            [ -e "$f" ] || { echo "missing asset: $rel"; fail=1; }
          done < <(grep -rhoE '\]\(\.\.?/?(img|audio)/[^)]+\)' docs --include="*.md" | tr -d '])' | sed 's/^(//' | sort -u)
          exit $fail
      - name: The code the docs hand people parses, and does what it claims
        run: python3 tools/check_doc_recipes.py
      - name: Cross-doc links point at a file that exists
        run: |
          fail=0
          for f in $(find docs -name "*.md"); do
            # a doc link is relative to the file that carries it, so resolve it from there
            while read -r t; do
              [ -e "$(dirname "$f")/$t" ] || { echo "$f: links to $t which does not exist"; fail=1; }
            done < <(grep -oE '\]\((\.\./)*[a-z0-9/-]+\.md[^)]*\)' "$f" | sed 's/](\([^)#]*\).*/\1/' | sort -u)
          done
          exit $fail
